<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xpert2Min — Créer mon PDF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://npmcdn.com/parse/dist/parse.min.js"></script>
<style>
  :root{
    --black:#0A0A0B;
    --black-2:#141416;
    --red:#E8161C;
    --white:#F5F5F5;
    --grey:#8A8A8F;
    --line:#242426;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Inter', sans-serif;
    background:var(--black-2);
    color:var(--white);
    min-height:100vh;
  }

  /* HEADER */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:16px 24px;
    background:var(--black);
    border-bottom:1px solid var(--line);
  }
  .logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-family:'Archivo Black', sans-serif;
    font-size:16px;
  }
  .logo .x{
    width:26px; height:26px;
    background:linear-gradient(135deg, var(--red) 50%, var(--white) 50%);
    clip-path:polygon(20% 0%, 40% 0%, 100% 100%, 80% 100%, 0% 20%);
  }
  .logo span{ color:var(--red); }
  header nav a{
    color:var(--grey);
    text-decoration:none;
    font-size:13.5px;
    margin-left:22px;
  }
  header nav a.active{ color:var(--white); font-weight:600; }

  /* STEPS BAR */
  .steps{
    display:flex;
    justify-content:center;
    gap:6px;
    padding:18px 16px;
    max-width:520px;
    margin:0 auto;
  }
  .step-dot{
    flex:1;
    height:3px;
    background:var(--line);
    border-radius:2px;
  }
  .step-dot.active{ background:var(--red); }

  /* MAIN */
  main{
    max-width:560px;
    margin:0 auto;
    padding:12px 20px 60px;
  }
  .eyebrow{
    font-size:12px;
    color:var(--red);
    text-transform:uppercase;
    letter-spacing:0.06em;
    font-weight:700;
    margin-bottom:6px;
  }
  h1{
    font-family:'Archivo Black', sans-serif;
    font-size:24px;
    margin-bottom:6px;
  }
  .lead{
    color:var(--grey);
    font-size:14px;
    margin-bottom:28px;
  }

  .field{ margin-bottom:18px; }
  .field label{
    display:block;
    font-size:12.5px;
    color:var(--grey);
    margin-bottom:6px;
    text-transform:uppercase;
    letter-spacing:0.04em;
  }
  .field input, .field select, .field textarea{
    width:100%;
    padding:12px 14px;
    background:var(--black);
    border:1px solid var(--line);
    border-radius:8px;
    color:var(--white);
    font-size:14.5px;
    font-family:'Inter', sans-serif;
    outline:none;
  }
  .field input:focus, .field select:focus, .field textarea:focus{ border-color:var(--red); }
  .field textarea{ min-height:140px; resize:vertical; }

  .lang-choice{ display:flex; gap:10px; }
  .lang-choice label{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:11px 0;
    border:1px solid var(--line);
    border-radius:8px;
    cursor:pointer;
    font-size:13.5px;
    color:var(--grey);
    text-transform:none;
    margin:0;
  }
  .lang-choice input{ width:auto; accent-color:var(--red); }
  .lang-choice input:checked + span{ color:var(--white); }

  .import-zone{
    border:1.5px dashed var(--line);
    border-radius:10px;
    padding:24px;
    text-align:center;
    color:var(--grey);
    font-size:13px;
    cursor:pointer;
    margin-top:10px;
  }
  .import-zone:hover{ border-color:var(--red); }

  .next-btn{
    width:100%;
    padding:14px 0;
    margin-top:12px;
    background:var(--red);
    color:#fff;
    border:none;
    border-radius:8px;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
  }
  .next-btn:hover{ background:#c9121a; }

  .form-msg{
    min-height:16px;
    font-size:13px;
    margin-top:10px;
    text-align:center;
    color:var(--red);
  }
</style>
</head>
<body>

<header>
  <div class="logo"><div class="x"></div>XPERT<span>2</span>MIN</div>
  <nav>
    <a href="app.html" class="active">Créer</a>
    <a href="dashboard.html">Tableau de bord</a>
  </nav>
</header>

<div class="steps">
  <div class="step-dot active"></div>
  <div class="step-dot"></div>
  <div class="step-dot"></div>
  <div class="step-dot"></div>
</div>

<main>
  <div class="eyebrow">Étape 1 / 4</div>
  <h1>Parlez-nous de votre PDF</h1>
  <p class="lead">Ces informations aident l'IA à structurer un contenu adapté à votre sujet et à votre public.</p>

  <form id="info-form">
    <div class="field">
      <label for="titre">Titre du PDF</label>
      <input type="text" id="titre" placeholder="Ex. : Les fondamentaux du copywriting" required>
    </div>

    <div class="field">
      <label for="sujet">Sujet</label>
      <input type="text" id="sujet" placeholder="Ex. : Rédaction persuasive pour entrepreneurs" required>
    </div>

    <div class="field">
      <label for="objectif">Objectif</label>
      <input type="text" id="objectif" placeholder="Ex. : Aider les lecteurs à rédiger des textes qui vendent" required>
    </div>

    <div class="field">
      <label for="public">Public cible</label>
      <input type="text" id="public" placeholder="Ex. : Entrepreneurs et freelances débutants" required>
    </div>

    <div class="field">
      <label for="createur">Nom du créateur</label>
      <input type="text" id="createur" placeholder="Votre nom" required>
    </div>

    <div class="field">
      <label>Langue du document</label>
      <div class="lang-choice">
        <label><input type="radio" name="langue" value="fr" checked><span>Français</span></label>
        <label><input type="radio" name="langue" value="en"><span>Anglais</span></label>
      </div>
    </div>

    <div class="field">
      <label for="connaissances">Vos connaissances (texte)</label>
      <textarea id="connaissances" placeholder="Écrivez ou collez ici tout ce que vous savez sur le sujet..."></textarea>
    </div>

    <div class="field">
      <label>Documents importés (optionnel)</label>
      <div class="import-zone" onclick="document.getElementById('file-input').click()">
        Cliquez pour importer un ou plusieurs documents
      </div>
      <input type="file" id="file-input" multiple style="display:none">
    </div>

    <button type="submit" class="next-btn">Continuer</button>
    <p class="form-msg" id="info-msg"></p>
  </form>
</main>

<script>
  Parse.initialize("s1YvHg4CRjirbCydEjFLoBnkSxnNHBlXeBLSmJxq", "WgwearpWgCysVARQz6etPeujBL0ZspvkRCafYuZT");
  Parse.serverURL = "https://parseapi.back4app.com/";

  // Protection de la page : si personne n'est connecté, retour à la connexion
  if (!Parse.User.current()) {
    window.location.href = "index.html";
  }

  document.getElementById('info-form').addEventListener('submit', function(e){
    e.preventDefault();
    // Cette étape sera connectée à l'IA Groq à la prochaine action.
    document.getElementById('info-msg').textContent = "Étape suivante (design + IA) à venir.";
  });
</script>

</body>
        </html>
