<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Xpert2Min — Tableau de bord</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://npmcdn.com/parse/dist/parse.min.js"></script>
<style>
  :root{
    --black:#0A0A0B;
    --black-2:#141416;
    --red:#E8161C;
    --white:#F5F5F5;
    --grey:#8A8A8F;
    --line:#242426;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Inter', sans-serif;
    background:var(--black-2);
    color:var(--white);
    min-height:100vh;
  }
  .hidden{ display:none !important; }

  /* HEADER */
  header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:12px;
    padding:14px 18px;
    background:var(--black);
    border-bottom:1px solid var(--line);
    flex-wrap:wrap;
  }
  .logo{
    display:flex;
    align-items:center;
    gap:9px;
    font-family:'Archivo Black', sans-serif;
    font-size:14px;
    white-space:nowrap;
  }
  .logo .x-icon{ width:22px; height:22px; flex-shrink:0; }
  .logo .x-icon svg{ width:100%; height:100%; display:block; }
  .logo span{ color:var(--red); }
  header nav{ display:flex; align-items:center; gap:10px; margin-left:auto; }
  .icon-btn{
    background:transparent;
    border:1px solid var(--line);
    color:var(--white);
    width:32px; height:32px;
    border-radius:8px;
    font-size:14px;
    cursor:pointer;
  }
  .icon-btn:hover{ border-color:var(--red); }
  .credits-badge{
    display:flex;
    align-items:center;
    justify-content:center;
    min-width:32px;
    height:32px;
    padding:0 8px;
    background:transparent;
    border:1px solid var(--line);
    border-radius:8px;
    color:var(--white);
    font-size:12.5px;
    font-weight:800;
    cursor:pointer;
    transition:background .2s ease, border-color .2s ease, box-shadow .2s ease;
  }
  .credits-badge:hover{ border-color:var(--red); }
  .credits-badge.alerte{
    background:rgba(232,22,28,0.12);
    border-color:var(--red);
    color:var(--red);
    box-shadow:0 0 0 3px rgba(232,22,28,0.15);
    animation:pulse-credits 1.8s ease-in-out infinite;
  }
  @keyframes pulse-credits{
    0%, 100%{ box-shadow:0 0 0 3px rgba(232,22,28,0.15); }
    50%{ box-shadow:0 0 0 5px rgba(232,22,28,0.25); }
  }
  .lang-switch{
    background:transparent;
    border:1px solid var(--line);
    color:var(--white);
    font-size:11.5px;
    font-weight:700;
    padding:5px 9px;
    border-radius:6px;
    cursor:pointer;
    font-family:'Inter', sans-serif;
  }
  .lang-switch:hover{ border-color:var(--red); }

  /* MAIN */
  main{ max-width:560px; margin:0 auto; padding:20px 20px 60px; }

  .welcome-block{ margin-bottom:16px; }
  .welcome-title{
    font-family:'Archivo Black', sans-serif;
    font-size:22px;
    margin-bottom:8px;
  }
  .welcome-sub{
    color:var(--white);
    opacity:0.92;
    font-size:15.5px;
    font-weight:600;
    line-height:1.45;
  }

  .cta-main{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:9px;
    width:100%;
    padding:14px 0;
    margin-bottom:28px;
    background:var(--red);
    color:#fff;
    border:none;
    border-radius:14px;
    font-size:15.5px;
    font-weight:700;
    font-family:'Inter', sans-serif;
    cursor:pointer;
    text-align:center;
    text-decoration:none;
    box-shadow:0 8px 22px rgba(232,22,28,0.35);
    transition:transform .12s ease, box-shadow .12s ease, background .15s ease;
  }
  .cta-main:hover{ background:#c9121a; box-shadow:0 10px 26px rgba(232,22,28,0.45); }
  .cta-main:active{ transform:scale(0.97); box-shadow:0 4px 12px rgba(232,22,28,0.3); }
  .cta-main .cta-icon{ font-size:15px; }

  .section-block{ margin-bottom:28px; }
  .section-title{
    font-family:'Archivo Black', sans-serif;
    font-size:15px;
    margin-bottom:12px;
  }

  .pdf-list{ display:flex; flex-direction:column; gap:8px; }
  .pdf-item{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:var(--black);
    border:1px solid var(--line);
    border-radius:10px;
    padding:13px 14px;
    transition:border-color .15s ease, background .15s ease;
  }
  .pdf-item.clickable{ cursor:pointer; }
  .pdf-item.clickable:hover{ border-color:var(--red); background:rgba(232,22,28,0.05); }
  .pdf-item-info{ display:flex; align-items:center; gap:10px; min-width:0; }
  .pdf-item-icon{ font-size:16px; flex-shrink:0; }
  .pdf-item-text{ min-width:0; }
  .pdf-item-title{
    font-size:13.5px;
    font-weight:600;
    color:var(--white);
    margin-bottom:3px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .pdf-item-date{ font-size:11px; color:var(--grey); }
  .pdf-item-chevron{ font-size:16px; color:var(--grey); flex-shrink:0; }
  .empty-state{
    color:var(--grey);
    font-size:13px;
    text-align:center;
    padding:24px 10px;
    border:1px dashed var(--line);
    border-radius:10px;
  }

  .saved-count-block{
    display:flex;
    align-items:center;
    gap:8px;
    background:var(--black);
    border:1px solid var(--line);
    border-radius:10px;
    padding:13px 14px;
    font-size:13px;
    color:var(--grey);
  }
  .saved-count-value{
    color:var(--red);
    font-weight:800;
    font-family:'Archivo Black', sans-serif;
    font-size:15px;
  }

  /* SETTINGS OVERLAY */
  .settings-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.6);
    z-index:100;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    opacity:1;
    transition:opacity .2s ease;
  }
  .settings-overlay.hidden{ display:none; }
  .settings-panel{
    background:var(--black);
    border-top:1px solid var(--line);
    border-radius:16px 16px 0 0;
    width:100%;
    max-width:560px;
    padding:22px 20px 30px;
    position:relative;
  }
  .settings-panel h2{
    font-family:'Archivo Black', sans-serif;
    font-size:16px;
    margin-bottom:16px;
  }
  .settings-row{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:12px 0;
    border-bottom:1px solid var(--line);
    font-size:13.5px;
  }
  .settings-row-label{ color:var(--grey); }
  .settings-row-value{ color:var(--white); font-weight:600; }
  .settings-btn{
    width:100%;
    margin-top:14px;
    padding:12px 0;
    border-radius:8px;
    font-size:13.5px;
    font-weight:600;
    font-family:'Inter', sans-serif;
    cursor:pointer;
    border:1px solid var(--line);
    background:transparent;
    color:var(--white);
  }
  .settings-btn:disabled{ opacity:0.45; cursor:not-allowed; }
  .settings-btn.danger{ color:var(--red); border-color:var(--red); }
  .settings-close{
    position:absolute;
    top:16px; right:16px;
    background:none;
    border:none;
    color:var(--grey);
    font-size:18px;
    cursor:pointer;
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="x-icon">
      <svg viewBox="0 0 200 200" fill="none">
        <polygon points="30,30 85,30 170,170 115,170" fill="#E8161C"/>
        <polygon points="170,30 115,30 30,170 85,170" fill="#F5F5F5"/>
      </svg>
    </div>
    XPERT<span>2</span>MIN
  </div>
  <nav>
    <button type="button" class="credits-badge hidden" id="credits-badge" onclick="window.location.href='pricing.html'" title="Générations restantes">
      <span id="credits-valeur">—</span>
    </button>
    <button type="button" class="icon-btn" onclick="ouvrirParametres()">⚙️</button>
    <button type="button" class="lang-switch" id="lang-switch" onclick="toggleLangue()">EN</button>
  </nav>
</header>

<main>

  <div class="welcome-block">
    <div class="welcome-title" id="welcome-title">Bonjour 👋</div>
    <p class="welcome-sub" data-i18n="welcome_sub">Prêt à transformer une nouvelle expertise en produit professionnel en 2 minutes ?</p>
  </div>

  <a href="app.html" class="cta-main"><span class="cta-icon">✨</span><span data-i18n="cta_transformer">Transformer votre expertise</span></a>

  <div class="section-block">
    <div class="section-title" data-i18n="titre_mes_pdf">📚 Mes PDF</div>
    <div class="pdf-list" id="pdf-list">
      <p class="empty-state" data-i18n="chargement_pdf">Chargement...</p>
    </div>
  </div>

  <div class="section-block">
    <div class="saved-count-block">
      📁 <span data-i18n="lbl_pdf_enregistres">PDF enregistrés</span> : <span class="saved-count-value" id="saved-count">0</span>
    </div>
  </div>

</main>

<!-- PANNEAU DES PARAMÈTRES -->
<div class="settings-overlay hidden" id="settings-overlay">
  <div class="settings-panel">
    <button type="button" class="settings-close" onclick="fermerParametres()">✕</button>
    <h2 data-i18n="param_titre">⚙️ Paramètres</h2>

    <div class="settings-row">
      <span class="settings-row-label" data-i18n="param_email">📧 E-mail</span>
      <span class="settings-row-value" id="param-email">—</span>
    </div>
    <div class="settings-row">
      <span class="settings-row-label" data-i18n="param_langue">🌐 Langue</span>
      <span class="settings-row-value" id="param-langue-valeur">Français</span>
    </div>
    <div class="settings-row">
      <span class="settings-row-label" data-i18n="param_abonnement">💳 Abonnement</span>
      <span class="settings-row-value" id="param-abonnement">Aucun abonnement actif</span>
    </div>

    <button type="button" class="settings-btn" onclick="window.location.href='pricing.html'" data-i18n="param_acheter">🛒 Acheter des générations</button>
    <button type="button" class="settings-btn danger" onclick="deconnexion()" data-i18n="param_deconnexion">🚪 Déconnexion</button>
  </div>
</div>

<script>
  var traductions = {
    fr: {
      welcome_sub: "Prêt à transformer une nouvelle expertise en produit professionnel en 2 minutes ?",
      cta_transformer: "Transformer votre expertise",
      titre_mes_pdf: "📚 Mes PDF", chargement_pdf: "Chargement...", aucun_pdf: "Vous n'avez encore créé aucun PDF.",
      lbl_pdf_enregistres: "PDF enregistrés",
      param_titre: "⚙️ Paramètres", param_email: "📧 E-mail", param_langue: "🌐 Langue", param_abonnement: "💳 Abonnement",
      aucun_abonnement: "Aucun abonnement actif",
      param_acheter: "🛒 Acheter des générations", param_deconnexion: "🚪 Déconnexion",
      bonjour: "Bonjour"
    },
    en: {
      welcome_sub: "Ready to turn a new expertise into a professional product in 2 minutes?",
      cta_transformer: "Turn your expertise into a product",
      titre_mes_pdf: "📚 My PDFs", chargement_pdf: "Loading...", aucun_pdf: "You haven't created any PDF yet.",
      lbl_pdf_enregistres: "PDFs saved",
      param_titre: "⚙️ Settings", param_email: "📧 Email", param_langue: "🌐 Language", param_abonnement: "💳 Subscription",
      aucun_abonnement: "No active subscription",
      param_acheter: "🛒 Buy generations", param_deconnexion: "🚪 Log out",
      bonjour: "Hello"
    }
  };

  function appliquerLangue(langue){
    document.querySelectorAll('[data-i18n]').forEach(function(el){
      var cle = el.getAttribute('data-i18n');
      if (traductions[langue][cle] !== undefined) el.textContent = traductions[langue][cle];
    });
    document.getElementById('lang-switch').textContent = (langue === 'fr') ? 'EN' : 'FR';
    document.getElementById('param-langue-valeur').textContent = (langue === 'fr') ? 'Français' : 'English';
    document.documentElement.lang = langue;
    localStorage.setItem('xpert2min_langue', langue);
    afficherAccueil();
  }

  function toggleLangue(){
    var actuelle = localStorage.getItem('xpert2min_langue') || 'fr';
    appliquerLangue(actuelle === 'fr' ? 'en' : 'fr');
  }

  Parse.initialize("s1YvHg4CRjirbCydEjFLoBnkSxnNHBlXeBLSmJxq", "WgwearpWgCysVARQz6etPeujBL0ZspvkRCafYuZT");
  Parse.serverURL = "https://parseapi.back4app.com/";

  if (!Parse.User.current()) {
    window.location.href = "index.html";
  }

  var dernierPrenom = '';

  function afficherAccueil(){
    var langue = localStorage.getItem('xpert2min_langue') || 'fr';
    var texte = dernierPrenom ? (traductions[langue].bonjour + ' ' + dernierPrenom + ' 👋') : (traductions[langue].bonjour + ' 👋');
    document.getElementById('welcome-title').textContent = texte;
  }

  async function chargerDashboard(){
    var langue = localStorage.getItem('xpert2min_langue') || 'fr';

    // La pastille de générations ne s'affiche que si un plan payant est actif
    try {
      await Parse.User.current().fetch();
      var planActuel = Parse.User.current().get('planActuel');
      var badge = document.getElementById('credits-badge');
      if (planActuel) {
        var genRestantes = Parse.User.current().get('generationsRestantes') || 0;
        badge.classList.remove('hidden');
        document.getElementById('credits-valeur').textContent = genRestantes;
        badge.classList.toggle('alerte', genRestantes <= 2);
      } else {
        badge.classList.add('hidden');
      }
    } catch (erreurCredits) {
      console.error('Erreur de chargement des générations restantes :', erreurCredits.message);
    }

    var Project = Parse.Object.extend('Project');
    var query = new Parse.Query(Project);
    query.equalTo('utilisateur', Parse.User.current());
    query.descending('createdAt');

    try {
      var projets = await query.find();

      // Prénom pour le message de bienvenue : projet le plus récent
      if (projets.length > 0) {
        dernierPrenom = projets[0].get('prenom') || '';
      }
      afficherAccueil();

      // Liste des PDF
      var liste = document.getElementById('pdf-list');
      if (projets.length === 0) {
        liste.innerHTML = '<p class="empty-state" data-i18n="aucun_pdf">' + traductions[langue].aucun_pdf + '</p>';
      } else {
        liste.innerHTML = projets.map(function(p){
          var dateDL = p.get('dateTelechargement');
          var date = dateDL
            ? (dateDL.toLocaleDateString() + ' à ' + dateDL.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}))
            : (p.createdAt ? p.createdAt.toLocaleDateString() : '');
          var lienPdf = p.get('pdfUrl');
          var titre = escapeHTML(p.get('titre') || 'Sans titre');
          if (lienPdf) {
            return '<div class="pdf-item clickable" onclick="window.open(\'' + lienPdf + '\', \'_blank\')">' +
              '<div class="pdf-item-info"><span class="pdf-item-icon">📄</span><div class="pdf-item-text">' +
              '<div class="pdf-item-title">' + titre + '</div><div class="pdf-item-date">' + date + '</div></div></div>' +
              '<span class="pdf-item-chevron">›</span></div>';
          }
          return '<div class="pdf-item">' +
            '<div class="pdf-item-info"><span class="pdf-item-icon">📄</span><div class="pdf-item-text">' +
            '<div class="pdf-item-title">' + titre + '</div><div class="pdf-item-date">' + date + '</div></div></div>' +
            '</div>';
        }).join('');
      }

      // PDF enregistrés
      document.getElementById('saved-count').textContent = projets.length;

    } catch (error) {
      console.error('Erreur de chargement du dashboard :', error.message);
    }
  }

  function escapeHTML(str){
    var div = document.createElement('div');
    div.textContent = str || '';
    return div.innerHTML;
  }

  function ouvrirParametres(){
    document.getElementById('param-email').textContent = Parse.User.current() ? Parse.User.current().get('email') : '—';

    var langueActive = localStorage.getItem('xpert2min_langue') || 'fr';
    var planActuel = Parse.User.current() ? Parse.User.current().get('planActuel') : null;
    var libellesPlan = (langueActive === 'en')
      ? { starter: 'Starter — active subscription', unite: 'Pay-per-generation', aucun: 'No active subscription' }
      : { starter: 'Starter — abonnement actif', unite: 'Paiement à l’unité', aucun: 'Aucun abonnement actif' };
    document.getElementById('param-abonnement').textContent = libellesPlan[planActuel] || libellesPlan.aucun;

    document.getElementById('settings-overlay').classList.remove('hidden');
  }
  function fermerParametres(){
    document.getElementById('settings-overlay').classList.add('hidden');
  }

  function deconnexion(){
    Parse.User.logOut().then(function(){
      window.location.href = 'index.html';
    });
  }

  appliquerLangue(localStorage.getItem('xpert2min_langue') || 'fr');
  chargerDashboard();
</script>

</body>
</html>
